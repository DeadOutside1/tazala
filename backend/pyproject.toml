[project]
name = "tazala"
version = "0.1.0"
description = "Telegram Info-Detox Bot — сброс непрочитанных, авто-папки, Wrapped"
requires-python = ">=3.12"
license = {text = "MIT"}

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "telethon>=1.37.0",
    "aiogram>=3.13.0",
    "redis[hiredis]>=5.0.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    "qrcode[pil]>=8.0",
    "structlog>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
